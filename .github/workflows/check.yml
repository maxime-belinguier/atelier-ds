name: Qualifier le starter
# Lancé à la main (onglet Actions › Run workflow) : chaque passage coûte des
# minutes Actions, surtout sur macOS (×10) et Windows (×2).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:launcher
      - run: npm run qualify
      - run: npm run scan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
